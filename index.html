
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueStar Prime⭐ Trading Journal</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#07111f;
  --card:#0d1b2d;
  --card2:#10243b;
  --input:#091626;
  --border:#1d3552;
  --blue:#2f8cff;
  --green:#19c37d;
  --red:#ff4d67;
  --gold:#f5c451;
  --text:#f4f7fb;
  --muted:#8fa4bd;
  --shadow:0 15px 40px rgba(0,0,0,.25);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(145deg,#050c16,#09182a 55%,#07111f);
  color:var(--text);
}

.container{
  width:min(1100px,94%);
  margin:auto;
  padding:20px 0 50px;
}

.header{
  background:linear-gradient(135deg,#10243b,#0b1728);
  border:1px solid var(--border);
  border-radius:22px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#17375c;
  font-size:25px;
}

.brand h1{
  margin:0;
  font-size:22px;
}

.brand p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

.user{
  margin-top:18px;
  padding:13px 15px;
  background:#091626;
  border:1px solid var(--border);
  border-radius:14px;
  color:#dce8f5;
}

.user strong{
  color:var(--blue);
}

.section{
  background:rgba(13,27,45,.96);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.section-title h2{
  margin:0;
  font-size:18px;
}

.section-title span{
  color:var(--muted);
  font-size:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  margin-bottom:8px;
}

.stat-value{
  font-size:22px;
  font-weight:bold;
}

.green{
  color:var(--green);
}

.red{
  color:var(--red);
}

.gold{
  color:var(--gold);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-size:12px;
  color:var(--muted);
}

input,
select,
textarea{
  width:100%;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px;
  outline:none;
  font-size:14px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--blue);
}

textarea{
  min-height:90px;
  resize:vertical;
}

.button-row{
  display:flex;
  gap:10px;
  margin-top:18px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.save{
  background:var(--blue);
  color:white;
  flex:1;
}

.clear{
  background:#291522;
  color:#ff7b8d;
  border:1px solid #512031;
}

.trade{
  background:#0a1829;
  border:1px solid var(--border);
  border-radius:16px;
  padding:17px;
  margin-bottom:12px;
}

.trade-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.pair{
  font-weight:bold;
  font-size:16px;
}

.badge{
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.badge.win{
  background:rgba(25,195,125,.12);
  color:var(--green);
}

.badge.loss{
  background:rgba(255,77,103,.12);
  color:var(--red);
}

.badge.breakeven{
  background:rgba(245,196,81,.12);
  color:var(--gold);
}

.trade-info{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.info{
  background:#0d2035;
  border-radius:10px;
  padding:10px;
}

.info small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:5px;
}

.info strong{
  font-size:13px;
}

.notes{
  margin-top:12px;
  color:#b8c8d9;
  font-size:13px;
  line-height:1.5;
}

.delete{
  margin-top:12px;
  background:#28131b;
  color:#ff7082;
  border:1px solid #4a1d29;
  padding:9px 13px;
  font-size:12px;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

.status{
  margin-top:12px;
  font-size:12px;
  color:var(--muted);
  text-align:center;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .trade-info{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .container{
    width:94%;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .button-row{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <div class="brand">
      <div class="logo">⭐</div>
      <div>
        <h1>BlueStar Prime</h1>
        <p>Professional Trading Journal</p>
      </div>
    </div>

    <div class="user">
      👤 Trader:
      <strong id="telegramUser">Loading...</strong>
    </div>
  </header>

  <!-- DASHBOARD -->
  <section class="section">

    <div class="section-title">
      <h2>📊 Trading Dashboard</h2>
      <span>Performance Overview</span>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-label">Total Trades</div>
        <div class="stat-value" id="totalTrades">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Wins</div>
        <div class="stat-value green" id="wins">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Losses</div>
        <div class="stat-value red" id="losses">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Win Rate</div>
        <div class="stat-value gold" id="winRate">0%</div>
      </div>

      <div class="stat">
        <div class="stat-label">Total Profit</div>
        <div class="stat-value green" id="totalProfit">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Total Loss</div>
        <div class="stat-value red" id="totalLoss">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Net P/L</div>
        <div class="stat-value" id="netPL">0</div>
      </div>

    </div>
  </section>

  <!-- ADD TRADE -->
  <section class="section">

    <div class="section-title">
      <h2>➕ Add New Trade</h2>
      <span>Record your position</span>
    </div>

    <form id="tradeForm">

      <div class="form-grid">

        <div class="field">
          <label>Coin / Pair</label>
          <input id="pair" required placeholder="e.g. BTC/USDT">
        </div>

        <div class="field">
          <label>Trading Date</label>
          <input id="tradingDate" type="date" required>
        </div>

        <div class="field">
          <label>Direction</label>
          <select id="direction">
            <option value="Long">Long</option>
            <option value="Short">Short</option>
          </select>
        </div>

        <div class="field">
          <label>Entry Price</label>
          <input id="entryPrice" type="number" step="any" placeholder="Enter entry price">
        </div>

        <div class="field">
          <label>Exit Price</label>
          <input id="exitPrice" type="number" step="any" placeholder="Enter exit price">
        </div>

        <div class="field">
          <label>Stop Loss</label>
          <input id="stopLoss" type="number" step="any" placeholder="Enter stop loss">
        </div>

        <div class="field">
          <label>Take Profit</label>
          <input id="takeProfit" type="number" step="any" placeholder="Enter take profit">
        </div>

        <div class="field">
          <label>Trade Amount</label>
          <input
            id="tradeAmount"
            type="number"
            inputmode="decimal"
            step="any"
            min="0"
            placeholder="Enter trade amount"
          >
        </div>

        <div class="field">
          <label>Risk %</label>
          <input id="riskPercent" type="number" step="any" min="0" placeholder="e.g. 2">
        </div>

        <div class="field">
          <label>Result</label>
          <select id="result">
            <option value="Win">Win</option>
            <option value="Loss">Loss</option>
            <option value="Breakeven">Breakeven</option>
          </select>
        </div>

        <div class="field">
          <label>Amount Won / Lost</label>
          <input id="pnlAmount" type="number" step="any" placeholder="e.g. 150 or -80">
        </div>

        <div class="field full">
          <label>Notes</label>
          <textarea id="notes" placeholder="Write your trade notes..."></
