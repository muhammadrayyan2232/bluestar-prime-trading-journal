<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueStar Prime⭐ Trading Journal</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:#ffffff;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:18px;
}

.header{
    background:linear-gradient(135deg,#10243d,#0b1729);
    border:1px solid #1d3b5d;
    border-radius:18px;
    padding:22px;
    margin-bottom:18px;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:8px 0 0;
    color:#9fb2c8;
}

.section{
    background:#0c1929;
    border:1px solid #1c344f;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

.section h2{
    margin-top:0;
    font-size:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.stat{
    background:#101f32;
    border:1px solid #203b58;
    border-radius:14px;
    padding:15px;
}

.stat-title{
    color:#91a6bc;
    font-size:13px;
}

.stat-value{
    margin-top:7px;
    font-size:21px;
    font-weight:bold;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1/-1;
}

label{
    margin-bottom:7px;
    color:#a9bad0;
    font-size:13px;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #29435e;
    border-radius:10px;
    background:#081522;
    color:#ffffff;
    padding:12px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#4e8dcc;
}

textarea{
    min-height:90px;
    resize:vertical;
}

button{
    border:0;
    border-radius:11px;
    padding:13px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn{
    background:#1f8f5f;
    color:#fff;
    width:100%;
    margin-top:15px;
}

.clear-btn{
    background:#702c35;
    color:#fff;
    margin-top:10px;
}

.trade{
    background:#101f32;
    border:1px solid #203b58;
    border-radius:14px;
    padding:15px;
    margin-bottom:12px;
}

.trade-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.trade-pair{
    font-size:17px;
    font-weight:bold;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    margin-top:7px;
}

.win{
    background:#164d35;
    color:#7ff0b3;
}

.loss{
    background:#54242b;
    color:#ff9ba5;
}

.breakeven{
    background:#51451f;
    color:#f4db75;
}

.trade-details{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-top:12px;
    color:#a9bad0;
    font-size:13px;
}

.trade-details span{
    color:#fff;
}

.delete-btn{
    background:#54242b;
    color:#ffb1b8;
    padding:8px 10px;
    font-size:12px;
}

.empty{
    text-align:center;
    color:#8fa3b8;
    padding:20px 5px;
}

.message{
    display:none;
    padding:12px;
    border-radius:10px;
    margin-top:12px;
    text-align:center;
    background:#123d2c;
    color:#91f0bd;
}

@media(max-width:650px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .trade-details{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>⭐ BlueStar Prime</h1>
        <p id="userName">Personal Trading Journal</p>
    </div>

    <div class="section">
        <h2>Trading Overview</h2>

        <div class="stats">
            <div class="stat">
                <div class="stat-title">Total Trades</div>
                <div class="stat-value" id="totalTrades">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">Wins</div>
                <div class="stat-value" id="wins">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">Losses</div>
                <div class="stat-value" id="losses">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">Win Rate</div>
                <div class="stat-value" id="winRate">0%</div>
            </div>

            <div class="stat">
                <div class="stat-title">Total Profit</div>
                <div class="stat-value" id="totalProfit">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">Total Loss</div>
                <div class="stat-value" id="totalLoss">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">Net P/L</div>
                <div class="stat-value" id="netPL">0</div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>➕ Add Trade</h2>

        <form id="tradeForm">

            <div class="form-grid">

                <div class="field">
                    <label>Coin / Pair</label>
                    <input type="text" id="pair" placeholder="e.g. BTCUSDT or EURUSD" required>
                </div>

                <div class="field">
                    <label>Trading Date</label>
                    <input type="date" id="tradingDate" required>
                </div>

                <div class="field">
                    <label>Direction</label>
                    <select id="direction" required>
                        <option value="">Select direction</option>
                        <option value="Long">Long</option>
                        <option value="Short">Short</option>
                    </select>
                </div>

                <div class="field">
                    <label>Trade Amount</label>
                    <input type="number" id="tradeAmount" step="any" placeholder="e.g. 100" required>
                </div>

                <div class="field">
                    <label>Risk %</label>
                    <input type="number" id="riskPercent" step="any" placeholder="e.g. 2">
                </div>

                <div class="field">
                    <label>Result</label>
                    <select id="result" required>
                        <option value="">Select result</option>
                        <option value="Win">Win</option>
                        <option value="Loss">Loss</option>
                        <option value="Breakeven">Breakeven</option>
                    </select>
                </div>

                <div class="field">
                    <label>Amount Won / Lost</label>
                    <input type="number" id="pnlAmount" step="any" placeholder="e.g. 25 or -15" required>
                </div>

                <div class="field full">
                    <label>Notes</label>
                    <textarea id="notes" placeholder="Write your trade notes..."></textarea>
                </div>

            </div>

            <button type="submit" class="save-btn">💾 Save Trade</button>

            <div id="message" class="message">
                Trade saved successfully.
            </div>

        </form>
    </div>

    <div class="section">
        <h2>📊 Trade History</h2>

        <div id="tradeHistory">
            <div class="empty">No trades recorded yet.</div>
        </div>

        <button type="button" class="clear-btn" id="clearAll">
            🗑 Clear All Trades
        </button>
    </div>

</div>

<script>
(function(){

"use strict";

const tg = window.Telegram && window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if(tg){
    tg.ready();
    tg.expand();
}

let trades = JSON.parse(
    localStorage.getItem("bluestarPrimeTrades") || "[]"
);

const userNameElement = document.getElementById("userName");

if(tg && tg.initDataUnsafe && tg.initDataUnsafe.user){

    const user = tg.initDataUnsafe.user;

    const fullName = [
        user.first_name || "",
        user.last_name || ""
    ].join(" ").trim();

    userNameElement.textContent =
        fullName
        ? "👤 " + fullName + " — Personal Trading Journal"
        : "Personal Trading Journal";

}else{
    userNameElement.textContent =
        "Personal Trading Journal";
}

function saveTrades(){
    localStorage.setItem(
        "bluestarPrimeTrades",
        JSON.stringify(trades)
    );
}

function updateDashboard(){

    const total = trades.length;

    const wins = trades.filter(
        t => t.result === "Win"
    ).length;

    const losses = trades.filter(
        t => t.result === "Loss"
    ).length;

    const profit = trades
        .filter(t => Number(t.pnlAmount) > 0)
        .reduce(
            (sum,t) => sum + Number(t.pnlAmount || 0),
            0
        );

    const loss = trades
        .filter(t => Number(t.pnlAmount) < 0)
        .reduce(
            (sum,t) => sum + Math.abs(Number(t.pnlAmount || 0)),
            0
        );

    const net = trades.reduce(
        (sum,t) => sum + Number(t.pnlAmount || 0),
        0
    );

    const winRate = total
        ? ((wins / total) * 100).toFixed(1)
        : 0;

    document.getElementById("totalTrades").textContent = total;
    document.getElementById("wins").textContent = wins;
    document.getElementById("losses").textContent = losses;
    document.getElementById("winRate").textContent = winRate + "%";
    document.getElementById("totalProfit").textContent = formatNumber(profit);
    document.getElementById("totalLoss").textContent = formatNumber(loss);
    document.getElementById("netPL").textContent = formatNumber(net);
}

function formatNumber(number){

    return Number(number || 0).toLocaleString(
        undefined,
        {
            maximumFractionDigits: 2
        }
    );
}

function renderHistory(){

    const history =
        document.getElementById("tradeHistory");

    if(trades.length === 0){

        history.innerHTML =
            '<div class="empty">No trades recorded yet.</div>';

        return;
    }

    history.innerHTML = "";

    [...trades]
        .reverse()
        .forEach(function(trade,index){

            const realIndex =
                trades.length - 1 - index;

            const resultClass =
                trade.result === "Win"
                ? "win"
                : trade.result === "Loss"
                ? "loss"
                : "breakeven";

            const pnl = Number(
                trade.pnlAmount || 0
            );

            const tradeElement =
                document.createElement("div");

            tradeElement.className = "trade";

            tradeElement.innerHTML = `
                <div class="trade-top">
                    <div>
                        <div class="trade-pair">
                            ${escapeHTML(trade.pair)}
                        </div>

                        <div class="badge ${resultClass}">
                            ${escapeHTML(trade.result)}
                        </div>
                    </div>

                    <button
                        class="delete-btn"
                        data-index="${realIndex}">
                        Delete
                    </button>
                </div>

                <div class="trade-details">

                    <div>
                        Date:
                        <span>
                            ${escapeHTML(trade.tradingDate)}
                        </span>
                    </div>

                    <div>
                        Direction:
                        <span>
                            ${escapeHTML(trade.direction)}
                        </span>
                    </div>

                    <div>
                        Trade Amount:
                        <span>
                            ${formatNumber(trade.tradeAmount)}
                        </span>
                    </div>

                    <div>
                        Risk:
                        <span>
                            ${formatNumber(trade.riskPercent)}%
                        </span>
                    </div>

                    <div>
                        Amount Won/Lost:
                        <span>
                            ${formatNumber(pnl)}
                        </span>
                    </div>

                    <div>
                        Notes:
                        <span>
                            ${escapeHTML(trade.notes || "-")}
                        </span>
                    </div>

                </div>
            `;

            history.appendChild(tradeElement);
        });

    document
        .querySelectorAll(".delete-btn")
        .forEach(function(button){

            button.addEventListener(
                "click",
                function(){

                    const index =
                        Number(button.dataset.index);

                    if(confirm("Delete this trade?")){

                        trades.splice(index,1);

                        saveTrades();
                        updateDashboard();
                        renderHistory();
                    }
                }
            );
        });
}

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

document
    .getElementById("tradeForm")
    .addEventListener("submit",function(event){

        event.preventDefault();

        const trade = {

            pair:
                document.getElementById("pair").value.trim(),

            tradingDate:
                document.getElementById("tradingDate").value,

            direction:
                document.getElementById("direction").value,

            tradeAmount:
                document.getElementById("tradeAmount").value,

            riskPercent:
                document.getElementById("riskPercent").value,

            result:
                document.getElementById("result").value,

            pnlAmount:
                document.getElementById("pnlAmount").value,

            notes:
                document.getElementById("notes").value.trim(),

            createdAt:
                new Date().toISOString()
        };

        trades.push(trade);

        saveTrades();
        updateDashboard();
        renderHistory();

        this.reset();

        const message =
            document.getElementById("message");

        message.style.display = "block";

        setTimeout(function(){
            message.style.display = "none";
        },2500);
    });

document
    .getElementById("clearAll")
    .addEventListener("click",function(){

        if(trades.length === 0){
            return;
        }

        if(confirm("Delete all recorded trades?")){

            trades = [];

            saveTrades();
            updateDashboard();
            renderHistory();
        }
    });

updateDashboard();
renderHistory();

})();
</script>

</body>
</html>
