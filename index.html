<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueStar Prime⭐ Trading Journal</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
}

.container{
  width:94%;
  max-width:1100px;
  margin:auto;
  padding:20px 0 50px;
}

.header,.section{
  background:#0d1b2d;
  border:1px solid #1d3552;
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
}

.header{
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:14px;
  background:#17375c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

h1{
  margin:0;
  font-size:22px;
}

.subtitle{
  color:#8fa4bd;
  margin-top:5px;
  font-size:13px;
}

.user{
  margin-top:18px;
  padding:13px;
  background:#091626;
  border:1px solid #1d3552;
  border-radius:12px;
}

.user span{
  color:#2f8cff;
  font-weight:bold;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.section-title h2{
  margin:0;
  font-size:18px;
}

.muted{
  color:#8fa4bd;
  font-size:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  background:#10243b;
  border:1px solid #1d3552;
  border-radius:15px;
  padding:15px;
}

.stat-label{
  color:#8fa4bd;
  font-size:12px;
}

.stat-value{
  margin-top:7px;
  font-size:21px;
  font-weight:bold;
}

.green{color:#19c37d}
.red{color:#ff4d67}
.gold{color:#f5c451}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.full{
  grid-column:1/-1;
}

label{
  color:#8fa4bd;
  font-size:12px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border-radius:11px;
  border:1px solid #1d3552;
  background:#091626;
  color:#fff;
  font-size:14px;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:#2f8cff;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

button{
  border:0;
  border-radius:11px;
  padding:13px 18px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.save-button{
  flex:1;
  background:#2f8cff;
  color:#fff;
}

.clear-button{
  background:#321522;
  color:#ff7082;
}

.status{
  text-align:center;
  margin-top:12px;
  font-size:13px;
  min-height:18px;
}

.trade{
  background:#091626;
  border:1px solid #1d3552;
  border-radius:15px;
  padding:16px;
  margin-bottom:12px;
}

.trade-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.pair{
  font-size:17px;
