<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BlueStar Prime⭐ Trading Journal</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #07111f;
  --panel: #0d1b2d;
  --panel-2: #11243a;
  --border: rgba(255,255,255,0.08);
  --text: #f4f7fb;
  --muted: #8ea1b8;
  --blue: #2f80ed;
  --blue-2: #56a3ff;
  --green: #20c997;
  --red: #ff5c6c;
  --gold: #f5c451;
  --input: #091726;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at top right, rgba(47,128,237,.18), transparent 30%),
    linear-gradient(180deg, #07111f 0%, #091522 100%);
  color: var(--text);
  min-height: 100vh;
}

header {
  background:
    linear-gradient(135deg, #0b1d34, #102d4d);
  border-bottom: 1px solid var(--border);
  padding: 22px 18px;
  position: relative;
  overflow: hidden;
}

header::after {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  right: -70px;
  top: -80px;
  background: rgba(47,128,237,.15);
  border-radius: 50%;
}

.header-inner {
  max-width: 950px;
  margin: auto;
  position: relative;
  z-index: 2;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1769e0, #4da3ff);
  box-shadow: 0 8px 25px rgba(47,128,237,.3);
  font-size: 21px;
}

.header-title {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: .2px;
}

.header-subtitle {
  margin-top: 4px;
  color: #a9bdd3;
  font-size: 12px;
}

.header-user {
  margin-top: 18px;
  padding: 11px 13px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px;
  font-size: 13px;
  color: #d9e7f6;
}

main {
  max-width: 950px;
  margin: auto;
  padding: 18px;
}

.card {
  background: linear-gradient(145deg, rgba(17,36,58,.98), rgba(10,25,42,.98));
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 19px;
  margin-bottom: 18px;
  box-shadow: 0 15px 35px rgba(0,0,0,.18);
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 16px;
}

.section-title {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
}

.section-caption {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 11px;
}

.stat {
  background: rgba(255,255,255,.035);
  border: 1px solid var(--border);
  padding: 15px;
  border-radius: 14px;
  position: relative;
  overflow: hidden;
}

.stat::after {
  content: "";
  position: absolute;
  width: 55px;
  height: 55px;
  right: -20px;
  bottom: -25px;
  border-radius: 50%;
  background: rgba(47,128,237,.08);
}

.stat-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .5px;
}

.stat-value {
  display: block;
  margin-top: 7px;
  font-size: 21px;
  font-weight: 800;
}

#netPL {
  color: var(--green);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 13px;
}

label {
  display: block;
  margin-top: 6px;
  color: #b9c9da;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .4px;
}

input,
select,
textarea,
button {
  width: 100%;
  font-family: inherit;
  font-size: 14px;
}

input,
select,
textarea {
  padding: 12px 13px;
  margin-top: 7px;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,.09);
  background: var(--input);
  color: var(--text);
  outline: none;
  transition: .2s;
}

input::placeholder,
textarea::placeholder {
  color: #61758b;
}

input:focus,
select:focus,
textarea:focus {
  border-color: rgba(47,128,237,.8);
  box-shadow: 0 0 0 3px rgba(47,128,237,.12);
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.primary-btn {
  border: none;
  margin-top: 16px;
  padding: 13px;
  border-radius: 11px;
  background: linear-gradient(135deg, #1769e0, #328cf4);
  color: white;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(47,128,237,.22);
}

.primary-btn:hover {
  filter: brightness(1.08);
}

.message {
  margin-top: 11px;
  font-size: 13px;
  color: var(--green);
  text-align: center;
  font-weight: 700;
}

.trade {
  border: 1px solid var(--border);
  background: rgba(255,255,255,.025);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 11px;
}

.trade:last-child {
  margin-bottom: 0;
}

.trade-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.trade-pair {
  font-size: 16px;
  font-weight: 800;
  color: white;
}

.trade-date {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}

.result-badge {
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
}

.win {
  color: var(--green);
  font-weight: 800;
}

.loss {
  color: var(--red);
  font-weight: 800;
}

.breakeven {
  color: var(--gold);
  font-weight: 800;
}

.trade-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 13px;
}

.info-box {
  padding: 9px 10px;
  background: rgba(0,0,0,.14);
  border-radius: 9px;
}

.info-label {
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
}

.info-value {
  margin-top: 3px;
  font-size: 13px;
  font-weight: 700;
}

.trade-notes {
  margin-top: 10px;
  padding: 10px;
  border-left: 3px solid var(--blue);
  background: rgba(47,128,237,.06);
  color: #c7d6e7;
  font-size: 12px;
  line-height: 1.5;
  border-radius: 5px;
}

.delete-btn {
  width: auto;
  border: 1px solid rgba(255,92,108,.2);
  background: rgba(255,92,108,.08);
  color: #ff7c88;
  padding: 8px 11px;
  margin-top: 11px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.delete-btn:hover {
  background: rgba(255,92,108,.15);
}

.clear-btn {
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.04);
  color: #aebed0;
  padding: 11px;
  border-radius: 10px;
  margin-top: 15px;
  cursor: pointer;
  font-weight: 700;
}

.empty {
  color: var(--muted);
  text-align: center;
  padding: 25px 10px;
  border: 1px dashed rgba(255,255,255,.1);
  border-radius: 12px;
  font-size: 13px;
}

@media (max-width: 600px) {
  main {
    padding: 13px;
  }

  .card {
    padding: 15px;
    border-radius: 15px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .stats {
    grid-template-columns: 1fr 1fr;
  }

  .stat-value {
    font-size: 18px;
  }

  .trade-info {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

  <div class="header-inner">

    <div class="brand">
      <div class="logo">⭐</div>

      <div>
        <div class="header-title">
          BlueStar Prime

        <div class="header-subtitle">
          Professional Trading Journal
        </div>
      </div>
    </div>
